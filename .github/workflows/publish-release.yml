name: Publish ClassicMusic 1.15 Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-release.yml'

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-files
          gh run download 35209687433 -R alexandrkrasovsky-oss/classicmusic -n ClassicMusic-1.15 -D release-files
          test -f release-files/ClassicMusic-1.15.apk
          echo "4c748d40dcf0f955bab631c319f3d43c79bed9a524492f6974a4f2d4c5e0bbc4  release-files/ClassicMusic-1.15.apk" | sha256sum -c -

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.15 -R alexandrkrasovsky-oss/classicmusic >/dev/null 2>&1; then
            gh release upload v1.15 release-files/ClassicMusic-1.15.apk -R alexandrkrasovsky-oss/classicmusic --clobber
          else
            gh release create v1.15 release-files/ClassicMusic-1.15.apk \
              -R alexandrkrasovsky-oss/classicmusic \
              --title "ClassicMusic 1.15" \
              --notes "ClassicMusic 1.15. Final UI polish: softer button typography, Dark Marga mark on both Main and Favorites, centered distressed broken-ring music launcher icon, and 'волна по треку' replacing shuffle. Track wave uses the current song as the seed. Signed Android APK. SHA-256: 4c748d40dcf0f955bab631c319f3d43c79bed9a524492f6974a4f2d4c5e0bbc4"
          fi
