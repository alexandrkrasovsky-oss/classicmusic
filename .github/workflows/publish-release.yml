name: Publish ClassicMusic 1.23 Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-release.yml'

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-files
          gh run download 35240607030 -R alexandrkrasovsky-oss/classicmusic -n ClassicMusic-1.23 -D release-files
          test -f release-files/ClassicMusic-1.23.apk
          echo "9b69d490ac18c716019878105341d46904e7528471a1cb6799874dce85abe63e  release-files/ClassicMusic-1.23.apk" | sha256sum -c -

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.23 -R alexandrkrasovsky-oss/classicmusic >/dev/null 2>&1; then
            gh release upload v1.23 release-files/ClassicMusic-1.23.apk -R alexandrkrasovsky-oss/classicmusic --clobber
          else
            gh release create v1.23 release-files/ClassicMusic-1.23.apk \
              -R alexandrkrasovsky-oss/classicmusic \
              --title "ClassicMusic 1.23" \
              --notes "ClassicMusic 1.23. The radio power icon is now permanently visible and acts as a true toggle: red while radio is off, soft green with a subtle halo while a stream is loading or playing. Pressing the power icon while off starts the currently selected/default station; pressing it while on stops radio. The center of the radio card keeps the simple interaction from 1.22: first tap starts radio, following taps advance through stations, with explicit loading/error labels. The power icon is inset 12dp so its visual right edge aligns with the player's right-side controls instead of sticking to the card edge. Signed Android APK. SHA-256: 9b69d490ac18c716019878105341d46904e7528471a1cb6799874dce85abe63e"
          fi
