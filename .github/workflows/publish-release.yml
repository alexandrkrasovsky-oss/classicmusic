name: Publish ClassicMusic 1.26 Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-release.yml'

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-files
          gh run download 35252400884 -R alexandrkrasovsky-oss/classicmusic -n ClassicMusic-1.26 -D release-files
          test -f release-files/ClassicMusic-1.26.apk
          echo "3da5f46dd112d745b35517fccb583e0919d757b53bb78b2548b565dab47e7707  release-files/ClassicMusic-1.26.apk" | sha256sum -c -

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.26 -R alexandrkrasovsky-oss/classicmusic >/dev/null 2>&1; then
            gh release upload v1.26 release-files/ClassicMusic-1.26.apk -R alexandrkrasovsky-oss/classicmusic --clobber
          else
            gh release create v1.26 release-files/ClassicMusic-1.26.apk \
              -R alexandrkrasovsky-oss/classicmusic \
              --title "ClassicMusic 1.26" \
              --notes "ClassicMusic 1.26. The vintage dual L/R meters no longer use Android Visualizer and the app no longer requests audio/microphone access for them. To avoid that permission entirely, the meters are now a restrained playback-state-driven vintage animation rather than raw waveform measurement. They animate while Yandex music or radio is actually playing and extinguish immediately on pause or stop. The two 12-segment Japanese-deck-style rows, green signal segments and red overload tips are retained. Radio behavior and the lamp-style power indicator are unchanged. Signed Android APK. SHA-256: 3da5f46dd112d745b35517fccb583e0919d757b53bb78b2548b565dab47e7707"
          fi
