name: Publish ClassicMusic 1.14 Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-release.yml'

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-files
          gh run download 35208154102 -R alexandrkrasovsky-oss/classicmusic -n ClassicMusic-1.14 -D release-files
          test -f release-files/ClassicMusic-1.14.apk
          echo "f0364bbf14d11ae82ea0b6eacfbb18b71836bafd6d00e3232f50ed0c04004a09  release-files/ClassicMusic-1.14.apk" | sha256sum -c -

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.14 -R alexandrkrasovsky-oss/classicmusic >/dev/null 2>&1; then
            gh release upload v1.14 release-files/ClassicMusic-1.14.apk -R alexandrkrasovsky-oss/classicmusic --clobber
          else
            gh release create v1.14 release-files/ClassicMusic-1.14.apk \
              -R alexandrkrasovsky-oss/classicmusic \
              --title "ClassicMusic 1.14" \
              --notes "ClassicMusic 1.14. Unified compact 6dp vertical rhythm across Main and Favorites, fixed top-button geometry, short fade-out/fade-in page switching, simplified player text, softened secondary text, cold-start Play starts My Wave, new broken-ring music icon, and a subtle Dark Marga mark above Exit on the main screen. Signed Android APK. SHA-256: f0364bbf14d11ae82ea0b6eacfbb18b71836bafd6d00e3232f50ed0c04004a09"
          fi
