name: Publish ClassicMusic 1.20 Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-release.yml'

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-files
          gh run download 35235112821 -R alexandrkrasovsky-oss/classicmusic -n ClassicMusic-1.20 -D release-files
          test -f release-files/ClassicMusic-1.20.apk
          echo "8bae00b0a13ec81e0b78a236e3bd2eb00ab94cf59eae9e16e431711146ce91bf  release-files/ClassicMusic-1.20.apk" | sha256sum -c -

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.20 -R alexandrkrasovsky-oss/classicmusic >/dev/null 2>&1; then
            gh release upload v1.20 release-files/ClassicMusic-1.20.apk -R alexandrkrasovsky-oss/classicmusic --clobber
          else
            gh release create v1.20 release-files/ClassicMusic-1.20.apk \
              -R alexandrkrasovsky-oss/classicmusic \
              --title "ClassicMusic 1.20" \
              --notes "ClassicMusic 1.20. Radio is now one clean centered card: swipe left or right to move between stations, or tap the station name to advance. A small power control on the right starts or stops radio independently from Yandex Music. The selected station is remembered when radio is stopped, and station changes use a short soft slide/fade animation. The balanced 1.19 layout, compact Favorites player, automatic favorites loading and morph transition are retained. Signed Android APK. SHA-256: 8bae00b0a13ec81e0b78a236e3bd2eb00ab94cf59eae9e16e431711146ce91bf"
          fi
