name: Publish ClassicMusic 1.18 Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-release.yml'

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-files
          gh run download 35214966417 -R alexandrkrasovsky-oss/classicmusic -n ClassicMusic-1.18 -D release-files
          test -f release-files/ClassicMusic-1.18.apk
          echo "427df511ea0c8542cb22ffeac7f91e5abe5389151caef1c38360d74ee11d8c40  release-files/ClassicMusic-1.18.apk" | sha256sum -c -

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.18 -R alexandrkrasovsky-oss/classicmusic >/dev/null 2>&1; then
            gh release upload v1.18 release-files/ClassicMusic-1.18.apk -R alexandrkrasovsky-oss/classicmusic --clobber
          else
            gh release create v1.18 release-files/ClassicMusic-1.18.apk \
              -R alexandrkrasovsky-oss/classicmusic \
              --title "ClassicMusic 1.18" \
              --notes "ClassicMusic 1.18. The main screen is now one vertically centered composition with a strict 6dp rhythm between neighboring blocks. Favorites always uses the compact player: no cover, seek bar or time, leaving much more room for the song list. The hidden radio placeholder was removed entirely. The technical 'загрузить ещё' button was removed; favorites pages now load automatically as you scroll near the end. Cross-dissolve navigation remains. Signed Android APK. SHA-256: 427df511ea0c8542cb22ffeac7f91e5abe5389151caef1c38360d74ee11d8c40"
          fi
