name: Publish ClassicMusic 1.21 Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-release.yml'

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-files
          gh run download 35238374805 -R alexandrkrasovsky-oss/classicmusic -n ClassicMusic-1.21 -D release-files
          test -f release-files/ClassicMusic-1.21.apk
          echo "72abf53c137b847e2b56d7f50eff69f705e16bf80e85f3cc905569a5bf94c454  release-files/ClassicMusic-1.21.apk" | sha256sum -c -

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.21 -R alexandrkrasovsky-oss/classicmusic >/dev/null 2>&1; then
            gh release upload v1.21 release-files/ClassicMusic-1.21.apk -R alexandrkrasovsky-oss/classicmusic --clobber
          else
            gh release create v1.21 release-files/ClassicMusic-1.21.apk \
              -R alexandrkrasovsky-oss/classicmusic \
              --title "ClassicMusic 1.21" \
              --notes "ClassicMusic 1.21. Fixed the radio power control rendering by replacing the font-dependent Unicode glyph with a real Android vector icon, so it no longer appears as a missing-glyph box. The power control is also positioned on the same responsive right-third axis as the player's right-hand controls for cleaner symmetry. Radio swipe/tap behavior and the rest of the 1.20 interface are unchanged. Signed Android APK. SHA-256: 72abf53c137b847e2b56d7f50eff69f705e16bf80e85f3cc905569a5bf94c454"
          fi
