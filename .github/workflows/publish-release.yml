name: Publish ClassicMusic 1.17 Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-release.yml'

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-files
          gh run download 35213491821 -R alexandrkrasovsky-oss/classicmusic -n ClassicMusic-1.17 -D release-files
          test -f release-files/ClassicMusic-1.17.apk
          echo "bf2c3f72b5258331757879cb0d80e9e50272ef7a84cecc4beb651ab4ef6d94f5  release-files/ClassicMusic-1.17.apk" | sha256sum -c -

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.17 -R alexandrkrasovsky-oss/classicmusic >/dev/null 2>&1; then
            gh release upload v1.17 release-files/ClassicMusic-1.17.apk -R alexandrkrasovsky-oss/classicmusic --clobber
          else
            gh release create v1.17 release-files/ClassicMusic-1.17.apk \
              -R alexandrkrasovsky-oss/classicmusic \
              --title "ClassicMusic 1.17" \
              --notes "ClassicMusic 1.17. Main and Favorites now share a fixed responsive central stage, so the header, player anchor, radio slot and footer do not jump when switching sections. Favorites uses the remaining flexible area for its scrolling list. On short Android screens the player switches to the same compact mode on both pages. Section switching now uses a short Apple-like cross dissolve: the old content fades away while the new content appears through it with a subtle 0.99 to 1.0 scale. Signed Android APK. SHA-256: bf2c3f72b5258331757879cb0d80e9e50272ef7a84cecc4beb651ab4ef6d94f5"
          fi
