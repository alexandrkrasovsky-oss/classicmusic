name: Publish ClassicMusic 1.28 Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-release.yml'

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-files
          gh run download 35335036714 -R alexandrkrasovsky-oss/classicmusic -n ClassicMusic-1.28 -D release-files
          test -f release-files/ClassicMusic-1.28.apk
          echo "7d95a438c1aab25e108121b08565a25b5299018f5c81e74f6c246b8485ba529c  release-files/ClassicMusic-1.28.apk" | sha256sum -c -

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.28 -R alexandrkrasovsky-oss/classicmusic >/dev/null 2>&1; then
            gh release upload v1.28 release-files/ClassicMusic-1.28.apk -R alexandrkrasovsky-oss/classicmusic --clobber
          else
            gh release create v1.28 release-files/ClassicMusic-1.28.apk \
              -R alexandrkrasovsky-oss/classicmusic \
              --title "ClassicMusic 1.28" \
              --notes "ClassicMusic 1.28. Removed the easy-to-hit logout button from the main interface so accidental taps cannot sign the user out. The saved Yandex authorization remains in place as before. All 1.27 radio identity, antenna cover, lamp indicator, and permissionless vintage L/R meter behavior is retained. Signed Android APK. SHA-256: 7d95a438c1aab25e108121b08565a25b5299018f5c81e74f6c246b8485ba529c"\n          fi\n