name: Publish ClassicMusic 1.10 Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-release.yml'

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-files
          gh run download 35204235277 -R alexandrkrasovsky-oss/classicmusic -n ClassicMusic-1.10 -D release-files
          test -f release-files/ClassicMusic-1.10.apk
          echo "af943d8e8987c14a3844a346b6f21370c65cd4aae5234344214c46ff5c43eb24  release-files/ClassicMusic-1.10.apk" | sha256sum -c -

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.10 -R alexandrkrasovsky-oss/classicmusic >/dev/null 2>&1; then
            gh release upload v1.10 release-files/ClassicMusic-1.10.apk -R alexandrkrasovsky-oss/classicmusic --clobber
          else
            gh release create v1.10 release-files/ClassicMusic-1.10.apk \
              -R alexandrkrasovsky-oss/classicmusic \
              --title "ClassicMusic 1.10" \
              --notes "ClassicMusic 1.10. UI cleanup for favorites, radio placement and player spacing. Signed Android APK. SHA-256: af943d8e8987c14a3844a346b6f21370c65cd4aae5234344214c46ff5c43eb24"
          fi
