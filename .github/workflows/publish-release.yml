name: Publish ClassicMusic 1.25 Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-release.yml'

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-files
          gh run download 35249459891 -R alexandrkrasovsky-oss/classicmusic -n ClassicMusic-1.25 -D release-files
          test -f release-files/ClassicMusic-1.25.apk
          echo "70ed74c006b1128aa121bc3b55b1a31d17d74d9db7f6c77eda7ea8cbbecb18a1  release-files/ClassicMusic-1.25.apk" | sha256sum -c -

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.25 -R alexandrkrasovsky-oss/classicmusic >/dev/null 2>&1; then
            gh release upload v1.25 release-files/ClassicMusic-1.25.apk -R alexandrkrasovsky-oss/classicmusic --clobber
          else
            gh release create v1.25 release-files/ClassicMusic-1.25.apk \
              -R alexandrkrasovsky-oss/classicmusic \
              --title "ClassicMusic 1.25" \
              --notes "ClassicMusic 1.25. Added a restrained vintage Japanese-deck-style dual L/R meter beneath the artist: two rows of 12 rectangular segments, with soft green level segments and the final two red peak/overload segments. The meters react to the live playback signal with fast attack and slower falloff, freeze naturally on pause, disappear when nothing is playing, and stay hidden in the compact Favorites player. Android may ask once for audio/microphone permission because the system Visualizer API requires RECORD_AUDIO; the app attaches Visualizer to its own playback session and does not record or save microphone audio. Radio behavior and the 1.24 lamp indicator are retained. Signed Android APK. SHA-256: 70ed74c006b1128aa121bc3b55b1a31d17d74d9db7f6c77eda7ea8cbbecb18a1"
          fi
