name: Publish ClassicMusic 1.22 Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-release.yml'

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-files
          gh run download 35239589462 -R alexandrkrasovsky-oss/classicmusic -n ClassicMusic-1.22 -D release-files
          test -f release-files/ClassicMusic-1.22.apk
          echo "4b8b508a401ea7334c90196880a7263ab5a756640140a1d39c21376b7c9f061d  release-files/ClassicMusic-1.22.apk" | sha256sum -c -

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.22 -R alexandrkrasovsky-oss/classicmusic >/dev/null 2>&1; then
            gh release upload v1.22 release-files/ClassicMusic-1.22.apk -R alexandrkrasovsky-oss/classicmusic --clobber
          else
            gh release create v1.22 release-files/ClassicMusic-1.22.apk \
              -R alexandrkrasovsky-oss/classicmusic \
              --title "ClassicMusic 1.22" \
              --notes "ClassicMusic 1.22. Radio interaction is simplified: the first tap on the centered radio card starts the selected station, and each following tap advances to the next station. Swipe station switching has been removed. While a stream is connecting, the card explicitly shows the station name plus 'загрузка…'; connection failures show 'не удалось'. The power glyph is now frameless and stop-only, appears only while radio is loading/playing, and its visual right edge follows the same right edge as the player's right-side controls. Signed Android APK. SHA-256: 4b8b508a401ea7334c90196880a7263ab5a756640140a1d39c21376b7c9f061d"
          fi
