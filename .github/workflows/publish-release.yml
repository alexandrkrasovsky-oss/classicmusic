name: Publish ClassicMusic 1.12 Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-release.yml'

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-files
          gh run download 35206721146 -R alexandrkrasovsky-oss/classicmusic -n ClassicMusic-1.12 -D release-files
          test -f release-files/ClassicMusic-1.12.apk
          echo "a4b6b6a44344bbe7bdf6233dfc5392be4ba34c3784b646dec021ae81ab059ee4  release-files/ClassicMusic-1.12.apk" | sha256sum -c -

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.12 -R alexandrkrasovsky-oss/classicmusic >/dev/null 2>&1; then
            gh release upload v1.12 release-files/ClassicMusic-1.12.apk -R alexandrkrasovsky-oss/classicmusic --clobber
          else
            gh release create v1.12 release-files/ClassicMusic-1.12.apk \
              -R alexandrkrasovsky-oss/classicmusic \
              --title "ClassicMusic 1.12" \
              --notes "ClassicMusic 1.12. Cold-start playback controls now start My Wave: Play, Back, Next and Shuffle all begin playback when no track is loaded. Added the broken black ring launcher icon based on the Dark Marga mark. Signed Android APK. SHA-256: a4b6b6a44344bbe7bdf6233dfc5392be4ba34c3784b646dec021ae81ab059ee4"
          fi
