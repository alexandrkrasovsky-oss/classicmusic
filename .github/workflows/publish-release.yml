name: Publish ClassicMusic 1.11 Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-release.yml'

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-files
          gh run download 35205239539 -R alexandrkrasovsky-oss/classicmusic -n ClassicMusic-1.11 -D release-files
          test -f release-files/ClassicMusic-1.11.apk
          echo "84b85c573d18292df66c024ceccd56a9118676b03a32f5898e35a466e6882cba  release-files/ClassicMusic-1.11.apk" | sha256sum -c -

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.11 -R alexandrkrasovsky-oss/classicmusic >/dev/null 2>&1; then
            gh release upload v1.11 release-files/ClassicMusic-1.11.apk -R alexandrkrasovsky-oss/classicmusic --clobber
          else
            gh release create v1.11 release-files/ClassicMusic-1.11.apk \
              -R alexandrkrasovsky-oss/classicmusic \
              --title "ClassicMusic 1.11" \
              --notes "ClassicMusic 1.11. Interface polish: removed separator lines, normalized favorites spacing, balanced player progress/time/control spacing, and refined now-playing typography. Signed Android APK. SHA-256: 84b85c573d18292df66c024ceccd56a9118676b03a32f5898e35a466e6882cba"
          fi
