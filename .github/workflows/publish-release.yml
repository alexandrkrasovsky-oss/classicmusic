name: Publish ClassicMusic 1.16 Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-release.yml'

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-files
          gh run download 35212467558 -R alexandrkrasovsky-oss/classicmusic -n ClassicMusic-1.16 -D release-files
          test -f release-files/ClassicMusic-1.16.apk
          echo "1bc525051bb8f48b3d9669e1d834cb4e0396c11d2b0a30d11abaabe52fee7f85  release-files/ClassicMusic-1.16.apk" | sha256sum -c -

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.16 -R alexandrkrasovsky-oss/classicmusic >/dev/null 2>&1; then
            gh release upload v1.16 release-files/ClassicMusic-1.16.apk -R alexandrkrasovsky-oss/classicmusic --clobber
          else
            gh release create v1.16 release-files/ClassicMusic-1.16.apk \
              -R alexandrkrasovsky-oss/classicmusic \
              --title "ClassicMusic 1.16" \
              --notes "ClassicMusic 1.16. Main and Favorites now share the exact same top navigation: 'музыка без лишнего' plus 'моя волна' and 'любимые'. Tapping the already-active section gives the short hint 'ты и так здесь'. The header no longer changes to 'вернуться на главную', so switching pages keeps identical geometry. Signed Android APK. SHA-256: 1bc525051bb8f48b3d9669e1d834cb4e0396c11d2b0a30d11abaabe52fee7f85"
          fi
