name: Build ClassicMusic APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout current update files
        uses: actions/checkout@v4
        with:
          path: current

      - name: Checkout verified 1.3 base
        uses: actions/checkout@v4
        with:
          ref: f671a90da678fba509fbbeff81f56f282c9756e0
          path: base

      - name: Reconstruct verified 1.3 source
        shell: bash
        run: |
          cat base/source.part-* | base64 -d > ClassicMusic-source-1.3.zip
          echo "72efec36fd86c82fae239ed716e3bded0c156a70666609c5ff7a47f6fdc050ee  ClassicMusic-source-1.3.zip" | sha256sum -c -
          mkdir project
          unzip -q ClassicMusic-source-1.3.zip -d project

      - name: Apply and verify 1.8 UI source
        shell: bash
        run: |
          cd project/ClassicMusic-source-next
          gzip -dc ../../current/updates18/MainActivity.java.gz > app/src/main/java/ru/classic/music/MainActivity.java
          echo "29b56a16b3bb2ba3f025c0f4839fb3c68b7a5de1cab1a821a528d489cbb75da4  app/src/main/java/ru/classic/music/MainActivity.java" | sha256sum -c -
          grep -q 'favoritesHeader=button("любимые песни"' app/src/main/java/ru/classic/music/MainActivity.java
          grep -q 'getTopFadingEdgeStrength' app/src/main/java/ru/classic/music/MainActivity.java
          grep -q 'setFadingEdgeLength' app/src/main/java/ru/classic/music/MainActivity.java
          sed -i 's/--version-code 13 --version-name 1.3/--version-code 18 --version-name 1.8/' build-apk.sh
          sed -i 's/ClassicMusic-1.3.apk/ClassicMusic-1.8.apk/g' build-apk.sh

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 35 platform and build tools
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Build and verify signed APK
        working-directory: project/ClassicMusic-source-next
        shell: bash
        run: |
          sed -i 's/-bootclasspath "$ANDROID_JAR"/-classpath "$ANDROID_JAR"/' build-apk.sh
          chmod +x build-apk.sh
          ./build-apk.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClassicMusic-1.8
          path: project/ClassicMusic-source-next/build/manual/ClassicMusic-1.8.apk
          if-no-files-found: error

# source: verified binary blob updates18/MainActivity.java.gz
# build: 1.8
