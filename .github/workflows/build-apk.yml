name: Build ClassicMusic APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'source.part-*'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct and verify source archive
        shell: bash
        run: |
          cat source.part-* | base64 -d > ClassicMusic-source-1.3.zip
          echo "72efec36fd86c82fae239ed716e3bded0c156a70666609c5ff7a47f6fdc050ee  ClassicMusic-source-1.3.zip" | sha256sum -c -
          mkdir project
          unzip -q ClassicMusic-source-1.3.zip -d project

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 35 platform and build tools
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Build and verify signed APK
        working-directory: project/ClassicMusic-source-next
        shell: bash
        run: |
          chmod +x build-apk.sh
          ./build-apk.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClassicMusic-1.3
          path: project/ClassicMusic-source-next/build/manual/ClassicMusic-1.3.apk
          if-no-files-found: error
