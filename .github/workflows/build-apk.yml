name: Build ClassicMusic APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout current update files
        uses: actions/checkout@v4
        with:
          path: current

      - name: Checkout verified 1.3 base
        uses: actions/checkout@v4
        with:
          ref: f671a90da678fba509fbbeff81f56f282c9756e0
          path: base

      - name: Reconstruct verified 1.3 source
        shell: bash
        run: |
          cat base/source.part-* | base64 -d > ClassicMusic-source-1.3.zip
          echo "72efec36fd86c82fae239ed716e3bded0c156a70666609c5ff7a47f6fdc050ee  ClassicMusic-source-1.3.zip" | sha256sum -c -
          mkdir project
          unzip -q ClassicMusic-source-1.3.zip -d project

      - name: Apply verified 1.8 source, 1.9 patch and 1.10 UI cleanup
        shell: bash
        run: |
          cd project/ClassicMusic-source-next
          cat ../../current/updates18b/part-* | base64 -d | gzip -d > app/src/main/java/ru/classic/music/MainActivity.java
          echo "29b56a16b3bb2ba3f025c0f4839fb3c68b7a5de1cab1a821a528d489cbb75da4  app/src/main/java/ru/classic/music/MainActivity.java" | sha256sum -c -
          cat ../../current/updates19/patch.part-* | base64 -d > /tmp/patch19.py
          echo "fc6943e73814dd0434fc11a999c343114aa157fa48fd402080a458438243d4f4  /tmp/patch19.py" | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          jp=Path('app/src/main/java/ru/classic/music/MainActivity.java')
          js=jp.read_text()
          start=js.index('private final UiTheme[] themes')
          brace=js.index('{',start)
          depth=0
          end=None
          for i in range(brace,len(js)):
              if js[i]=='{': depth+=1
              elif js[i]=='}':
                  depth-=1
                  if depth==0:
                      end=js.index(';',i)+1
                      break
          if end is None: raise SystemExit('theme array end not found')
          block='''private final UiTheme[] themes={
              new UiTheme(0xffEEE6DA,0xffF8F1E7,0xffD5C6B2,0xffA85D2A,0xff211E1A,0xff2A2621,0xff7A6F63,0x28A85D2A),
              new UiTheme(0xffE8E8E8,0xffFAFAFA,0xffC8C8C8,0xff555555,0xff151515,0xff1B1B1B,0xff707070,0x1F555555),
              new UiTheme(0xffDDF4F0,0xffF6FFFD,0xff9FD8D0,0xff168E88,0xff172B29,0xff183C39,0xff607A77,0x2881D8D0),
              new UiTheme(0xffFBE7E2,0xffFFF8F6,0xffEFC0B5,0xffD66D5E,0xff332220,0xff482E2A,0xff8C6A64,0x28E58C7D),
              new UiTheme(0xffE8EBF2,0xffF8F9FC,0xffBDC5D6,0xff536A9B,0xff1F2633,0xff273248,0xff697386,0x28536A9B)
          };'''
          jp.write_text(js[:start]+block+js[end:])
          pp=Path('/tmp/patch19.py')
          ps=pp.read_text()
          ps=ps.replace("def sub1(pattern,repl,label,flags=0):\n    global s\n", "def sub1(pattern,repl,label,flags=0):\n    global s\n    if label=='themes': return\n")
          pp.write_text(ps)
          PY
          python3 /tmp/patch19.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/ru/classic/music/MainActivity.java')
          s=p.read_text()

          def one(old,new,label):
              global s
              count=s.count(old)
              if count!=1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              s=s.replace(old,new,1)

          # Favorites: only the top return control, no "моя волна / любимые" tabs.
          one('''        this.favoritesPage=favoritesPage;\n        updateBrandText();body.removeAllViews();list=null;more=null;\n        detach(controls);detach(status);''','''        this.favoritesPage=favoritesPage;\n        updateBrandText();\n        tabs.setVisibility(favoritesPage?View.GONE:View.VISIBLE);\n        body.removeAllViews();list=null;more=null;\n        detach(controls);detach(status);detach(radioButton);''','favorites navigation')

          # Radio lives by the main player; "выйти" remains the bottom root control.
          one('''        root.addView(radioButton,radioLp);''','''        // radioButton is attached next to the main player by showPage()''','radio root placement')
          one('''            LinearLayout.LayoutParams cp=new LinearLayout.LayoutParams(-1,-2);cp.setMargins(dp(4),dp(GAP),dp(4),0);mainContent.addView(controls,cp);\n            LinearLayout.LayoutParams sp=new LinearLayout.LayoutParams(-1,dp(24));sp.topMargin=dp(4);mainContent.addView(status,sp);''','''            LinearLayout.LayoutParams cp=new LinearLayout.LayoutParams(-1,-2);cp.setMargins(dp(4),dp(GAP),dp(4),0);mainContent.addView(controls,cp);\n            LinearLayout.LayoutParams rp=new LinearLayout.LayoutParams(-1,dp(50));rp.setMargins(dp(4),dp(6),dp(4),0);mainContent.addView(radioButton,rp);\n            LinearLayout.LayoutParams sp=new LinearLayout.LayoutParams(-1,dp(24));sp.topMargin=dp(4);mainContent.addView(status,sp);''','radio near player')

          # No favorite-count status on the main screen.
          one('''message(refs.isEmpty()?"Любимых песен пока нет":"Любимых песен: "+refs.size());updateList();''','''if(favoritesPage)message(refs.isEmpty()?"Любимых песен пока нет":"Любимых песен: "+refs.size());else{uiStatus="";if(status!=null)status.setText("");}updateList();''','favorite count on main')

          # Compact favorites player: equal breathing room above title and before buttons.
          one('''            controls.setPadding(dp(10),dp(8),dp(10),dp(8));''','''            controls.setPadding(dp(10),dp(10),dp(10),dp(10));''','compact player padding')
          one('''            LinearLayout.LayoutParams gp=(LinearLayout.LayoutParams)controlsGap.getLayoutParams();gp.height=dp(4);controlsGap.setLayoutParams(gp);''','''            LinearLayout.LayoutParams gp=(LinearLayout.LayoutParams)controlsGap.getLayoutParams();gp.height=dp(10);controlsGap.setLayoutParams(gp);''','compact player gap')

          # Favorites list gets the same paper/line/22dp card treatment as the player.
          one('''        if(adapter!=null)adapter.notifyDataSetChanged();''','''        if(list!=null)list.setBackground(shape(t.paper,t.line,22));\n        if(adapter!=null)adapter.notifyDataSetChanged();''','list theme card')
          one('''            list.setPadding(0,dp(6),0,dp(6));list.setClipToPadding(false);''','''            list.setPadding(dp(4),dp(6),dp(4),dp(6));list.setClipToPadding(false);list.setBackground(shape(activeTheme.paper,activeTheme.line,22));list.setClipToOutline(true);''','list card setup')
          one('''            list.setAdapter(adapter);list.setOnItemClickListener((p,v,i,id)->{uiStatus="";if(service!=null)stopRadio(true);service.startFavorites(favorites,i);});body.addView(list,new LinearLayout.LayoutParams(-1,0,1));''','''            list.setAdapter(adapter);list.setOnItemClickListener((p,v,i,id)->{uiStatus="";if(service!=null)stopRadio(true);service.startFavorites(favorites,i);});LinearLayout.LayoutParams listLp=new LinearLayout.LayoutParams(-1,0,1);listLp.setMargins(dp(4),dp(2),dp(4),dp(4));body.addView(list,listLp);''','list card margins')

          # Theme choice persists after restart.
          s=s.replace('getPreferences(MODE_PRIVATE).edit().putInt("theme_index",themeIndex).apply();','getSharedPreferences("ui",MODE_PRIVATE).edit().putInt("theme_index",themeIndex).apply();')
          p.write_text(s)
          PY
          grep -q 'radioButton=button("поймать радиоволну"' app/src/main/java/ru/classic/music/MainActivity.java
          grep -q 'вернуться на главную' app/src/main/java/ru/classic/music/MainActivity.java
          grep -q 'tabs.setVisibility(favoritesPage?View.GONE:View.VISIBLE)' app/src/main/java/ru/classic/music/MainActivity.java
          grep -q 'mainContent.addView(radioButton,rp)' app/src/main/java/ru/classic/music/MainActivity.java
          grep -q 'if(favoritesPage)message(refs.isEmpty()?' app/src/main/java/ru/classic/music/MainActivity.java
          grep -q 'controls.setPadding(dp(10),dp(10),dp(10),dp(10))' app/src/main/java/ru/classic/music/MainActivity.java
          grep -q 'gp.height=dp(10)' app/src/main/java/ru/classic/music/MainActivity.java
          grep -q 'list.setBackground(shape(activeTheme.paper,activeTheme.line,22))' app/src/main/java/ru/classic/music/MainActivity.java
          grep -q 'listLp.setMargins(dp(4),dp(2),dp(4),dp(4))' app/src/main/java/ru/classic/music/MainActivity.java
          grep -q 'getSharedPreferences("ui",MODE_PRIVATE).edit().putInt("theme_index",themeIndex).apply()' app/src/main/java/ru/classic/music/MainActivity.java
          grep -q 'https://hls-01-rbc.hostingradio.ru/rbc/playlist.m3u8' app/src/main/java/ru/classic/music/MainActivity.java
          grep -q 'getTopFadingEdgeStrength' app/src/main/java/ru/classic/music/MainActivity.java
          sed -i 's/--version-code 13 --version-name 1.3/--version-code 20 --version-name 1.10/' build-apk.sh
          sed -i 's/ClassicMusic-1.3.apk/ClassicMusic-1.10.apk/g' build-apk.sh

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 35 platform and build tools
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Build signed APK
        working-directory: project/ClassicMusic-source-next
        shell: bash
        run: |
          sed -i 's/-bootclasspath "$ANDROID_JAR"/-classpath "$ANDROID_JAR"/' build-apk.sh
          chmod +x build-apk.sh
          ./build-apk.sh
          sha256sum build/manual/ClassicMusic-1.10.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClassicMusic-1.10
          path: project/ClassicMusic-source-next/build/manual/ClassicMusic-1.10.apk
          if-no-files-found: error
