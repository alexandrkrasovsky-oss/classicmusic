name: Build ClassicMusic APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout current update files
        uses: actions/checkout@v4
        with:
          path: current

      - name: Checkout verified 1.3 base
        uses: actions/checkout@v4
        with:
          ref: f671a90da678fba509fbbeff81f56f282c9756e0
          path: base

      - name: Reconstruct verified 1.3 source
        shell: bash
        run: |
          cat base/source.part-* | base64 -d > ClassicMusic-source-1.3.zip
          echo "72efec36fd86c82fae239ed716e3bded0c156a70666609c5ff7a47f6fdc050ee  ClassicMusic-source-1.3.zip" | sha256sum -c -
          mkdir project
          unzip -q ClassicMusic-source-1.3.zip -d project

      - name: Apply verified 1.8 source and 1.9 patch
        shell: bash
        run: |
          cd project/ClassicMusic-source-next
          cat ../../current/updates18b/part-* | base64 -d | gzip -d > app/src/main/java/ru/classic/music/MainActivity.java
          echo "29b56a16b3bb2ba3f025c0f4839fb3c68b7a5de1cab1a821a528d489cbb75da4  app/src/main/java/ru/classic/music/MainActivity.java" | sha256sum -c -
          cat ../../current/updates19/patch.part-* | base64 -d > /tmp/patch19.py
          echo "fc6943e73814dd0434fc11a999c343114aa157fa48fd402080a458438243d4f4  /tmp/patch19.py" | sha256sum -c -
          python3 /tmp/patch19.py
          grep -q 'radioButton=button("поймать радиоволну"' app/src/main/java/ru/classic/music/MainActivity.java
          grep -q 'вернуться на главную' app/src/main/java/ru/classic/music/MainActivity.java
          grep -q 'https://hls-01-rbc.hostingradio.ru/rbc/playlist.m3u8' app/src/main/java/ru/classic/music/MainActivity.java
          grep -q '0xffDDF4F0' app/src/main/java/ru/classic/music/MainActivity.java
          grep -q 'getTopFadingEdgeStrength' app/src/main/java/ru/classic/music/MainActivity.java
          sed -i 's/--version-code 13 --version-name 1.3/--version-code 19 --version-name 1.9/' build-apk.sh
          sed -i 's/ClassicMusic-1.3.apk/ClassicMusic-1.9.apk/g' build-apk.sh

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 35 platform and build tools
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Build signed APK
        working-directory: project/ClassicMusic-source-next
        shell: bash
        run: |
          sed -i 's/-bootclasspath "$ANDROID_JAR"/-classpath "$ANDROID_JAR"/' build-apk.sh
          chmod +x build-apk.sh
          ./build-apk.sh
          sha256sum build/manual/ClassicMusic-1.9.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClassicMusic-1.9
          path: project/ClassicMusic-source-next/build/manual/ClassicMusic-1.9.apk
          if-no-files-found: error
