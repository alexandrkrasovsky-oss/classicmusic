name: Build ClassicMusic APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-apk.yml'
      - 'updates15/**'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct verified 1.3 source
        shell: bash
        run: |
          cat source.part-* | base64 -d > ClassicMusic-source-1.3.zip
          echo "72efec36fd86c82fae239ed716e3bded0c156a70666609c5ff7a47f6fdc050ee  ClassicMusic-source-1.3.zip" | sha256sum -c -
          mkdir project
          unzip -q ClassicMusic-source-1.3.zip -d project

      - name: Apply 1.5 source and cassette
        shell: bash
        run: |
          cd project/ClassicMusic-source-next
          cat ../../updates15/main.part-* | base64 -d | gzip -d > app/src/main/java/ru/classic/music/MainActivity.java
          mkdir -p app/src/main/res/drawable-nodpi
          cat ../../updates15/cassette.part-* | base64 -d > app/src/main/res/drawable-nodpi/cassette.jpg
          sed -i 's/--version-code 13 --version-name 1.3/--version-code 15 --version-name 1.5/' build-apk.sh
          sed -i 's/ClassicMusic-1.3.apk/ClassicMusic-1.5.apk/g' build-apk.sh

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 35 platform and build tools
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Build and verify signed APK
        working-directory: project/ClassicMusic-source-next
        shell: bash
        run: |
          sed -i 's/-bootclasspath "$ANDROID_JAR"/-classpath "$ANDROID_JAR"/' build-apk.sh
          chmod +x build-apk.sh
          ./build-apk.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClassicMusic-1.5
          path: project/ClassicMusic-source-next/build/manual/ClassicMusic-1.5.apk
          if-no-files-found: error
